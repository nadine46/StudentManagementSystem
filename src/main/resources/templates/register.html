<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #263b5e;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #263b5e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .success {
            color: #176b35;
            background: #e5f5e9;
            padding: 10px;
            border-radius: 4px;
        }

        .link {
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Student Registration</h1>

    <p class="success"
       th:if="${successMessage}"
       th:text="${successMessage}"></p>

    <form th:action="@{/student/register}"
          th:object="${student}"
          method="post">

        <label for="firstName">First Name</label>
        <input type="text" id="firstName"
               th:field="*{firstName}" required>

        <label for="lastName">Last Name</label>
        <input type="text" id="lastName"
               th:field="*{lastName}" required>

        <label for="email">Email</label>
        <input type="email" id="email"
               th:field="*{email}" required>

        <label for="age">Age</label>
        <input type="number" id="age"
               th:field="*{age}" min="19" required>

        <button type="submit">Register Student</button>
    </form>

    <div class="link">
        <a th:href="@{/student/all}">View All Students</a>
    </div>

</div>
</body>
</html>
